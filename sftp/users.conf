# ============================================================
# sftp/users.conf — Configuración de usuarios SFTP virtuales
# Usado por atmoz/sftp para configuración adicional por usuario
#
# Formato: usuario:password:uid:gid:directorio_home
# Los usuarios definidos aquí se suman al comando en docker-compose
# ============================================================

# Usuario principal (ya definido en docker-compose CMD)
# sftpuser:SftpPass123!:1001:1001:uploads

# Para agregar usuarios adicionales, descomentar y modificar:
# user2:OtraPass456!:1002:1001:uploads
# user3:MasPass789!:1003:1001:uploads
