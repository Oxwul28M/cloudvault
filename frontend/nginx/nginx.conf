# ============================================================
# nginx.conf - Reverse Proxy + Servidor de Archivos Estáticos
# CloudVault Frontend
# ============================================================

# Limitar conexiones y workers para e2-micro
worker_processes 1;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Optimizaciones de rendimiento
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length    1000;

    # Cabeceras de seguridad globales
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Ocultar versión de Nginx
    server_tokens off;

    # Límite de tamaño de body para uploads (debe coincidir con backend)
    client_max_body_size 55M;

    # -------------------------------------------------------
    # Upstream: Backend API Node.js
    # -------------------------------------------------------
    upstream backend_api {
        server backend:4000;
        keepalive 10;
    }

    # -------------------------------------------------------
    # Servidor HTTP (puerto 80) - redirige a HTTPS
    # (Descomentar cuando tengas SSL configurado)
    # -------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name tu-dominio.com;
    #     return 301 https://$host$request_uri;
    # }

    # -------------------------------------------------------
    # Servidor principal (HTTP en desarrollo, HTTPS en prod)
    # -------------------------------------------------------
    server {
        listen 80;
        server_name _;   # Acepta cualquier hostname (cambiar en prod)

        root   /usr/share/nginx/html;
        index  index.html;

        # ---- Archivos estáticos con caché ----
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ---- SPA fallback: todas las rutas al index.html ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- Proxy inverso hacia la API del backend ----
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
